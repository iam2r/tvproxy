name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu runner already carries the Android SDK; only the two packages this build needs are added.
      # (android-actions/setup-android@v3 currently fails on the removed "tools" package.)
      - name: Install platform and build tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          echo "SDK: $SDK"
          ls "$SDK/platforms" || true
          if [ -d "$SDK/platforms/android-34" ] && [ -d "$SDK/build-tools/34.0.0" ]; then
            echo "platform 34 and build-tools 34.0.0 already present"
            exit 0
          fi
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # Optional: add SIGNING_KEYSTORE_BASE64 (and the three passwords) as repository secrets to sign release
      # builds with a stable key. Without them the release APK is debug-signed: fine for sideloading, not for
      # in-place updates from a previous release.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "release keystore decoded"
          else
            echo "no keystore secret: falling back to the debug key"
          fi

      - name: Assemble release and debug
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"; fi
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Check the APK needs no native libraries
        run: |
          set -e
          apk=app/build/outputs/apk/release/app-release.apk
          ls -lh "$apk"
          if unzip -l "$apk" | grep -q ' lib/'; then
            echo "This project ships native code; per-ABI APKs are required." >&2
            unzip -l "$apk" | grep ' lib/' >&2
            exit 1
          fi
          echo "No native libraries: one universal APK runs on armeabi-v7a, arm64-v8a, x86 and x86_64." >> "$GITHUB_STEP_SUMMARY"

      - name: Name artifacts
        run: |
          set -e
          version=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/tvproxy-${version}-universal.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/tvproxy-${version}-debug.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvproxy-apk
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
