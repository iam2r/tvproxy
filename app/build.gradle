plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvproxy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvproxy'
        // The TV this was written for runs Android 9, but the app only uses APIs from before that.
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    // Every published build must carry the same key, or a TV refuses the update. The key comes from the
    // environment (CI secrets); without it a release build is signed with the debug key, which is fine
    // for sideloading over ADB.
    def keystorePath = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
